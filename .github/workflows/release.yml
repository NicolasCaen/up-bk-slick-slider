name: Release Plugin

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: |
          npm install
          npm install @wordpress/scripts@30.8.1 --save-dev
        
      - name: Build
        run: npm run build
        
      - name: Create plugin archive
        run: |
          # Create a clean directory for the plugin
          mkdir up-bk-slick-slider
          
          # Copy only the necessary files
          cp -r build up-bk-slick-slider/
          cp -r assets up-bk-slick-slider/
          cp *.php up-bk-slick-slider/
          cp readme.txt up-bk-slick-slider/
          cp LICENSE up-bk-slick-slider/
          
          # Create ZIP file
          zip -r up-bk-slick-slider.zip up-bk-slick-slider
          
      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./up-bk-slick-slider.zip
          asset_name: up-bk-slick-slider.zip
          asset_content_type: application/zip
